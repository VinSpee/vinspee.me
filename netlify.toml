[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Optional: headers/caching for static assets
[[headers]]
  for = "/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects for SPA routes if needed (Qwik City static generates files so usually not required)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
